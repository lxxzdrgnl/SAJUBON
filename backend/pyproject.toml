[project]
name = "saju-backend"
version = "0.1.0"
description = "사주구리 FastAPI 백엔드 — AI 사주 상담 서비스"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0",
    # LLM / LangChain
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-google-genai>=1.0.0",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    # ChromaDB (embedding util only — vector store는 pgvector)
    "chromadb>=0.5",
    "google-genai>=1.0",
    # pgvector — RAG 벡터 저장소 (PostgreSQL 확장)
    "pgvector>=0.2",
    # DB
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # engine dependencies
    "ephem>=4.1.5",
    "korean-lunar-calendar>=0.3.1",
    "pytz>=2024.1",
    # 도시 검색
    "geonamescache>=1.4.0",
    "timezonefinder>=6.5.0",
    "psycopg2-binary>=2.9.11",
    "python-jose[cryptography]>=3.5.0",
    "httpx>=0.28.1",
    "google-auth>=2.49.0",
    "authlib>=1.3.0",
    "itsdangerous>=2.1.2",
    # LangGraph / Postgres checkpoint
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary]>=3.1.0",
    # CLI
    "typer>=0.12.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27", "pytest-asyncio>=0.23"]
# IQHub(my-own-phoenix) 트레이싱 — make dev-phoenix 전에: uv sync --group observability
observability = [
    "openinference-instrumentation-langchain>=0.1.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
