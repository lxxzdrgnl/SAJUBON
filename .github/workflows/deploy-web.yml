name: Deploy Web

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 가정용 서버(동적 IP)라 ssh-keyscan 대신 appleboy/ssh-action으로 접속한다.
      # next build가 apps/web/.env.production을 읽으므로(NEXT_PUBLIC_* 빌드타임 인라인)
      # git reset 직후 untracked 경로에 WEB_ENV 시크릿을 heredoc로 기록한다.
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PC_SSH_HOST }}
          username: ${{ secrets.PC_SSH_USER }}
          key: ${{ secrets.PC_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd ~/servers/sajuguri/repo
            git fetch origin
            git reset --hard origin/main

            mkdir -p apps/web
            cat > apps/web/.env.production << 'WEBENV_EOF'
            ${{ secrets.WEB_ENV }}
            WEBENV_EOF

            cd ~/servers
            docker compose up -d --build --no-deps sajuguri-web

            echo '⏳ Waiting for web...'
            sleep 5
            docker compose logs --tail=20 sajuguri-web
            docker compose ps sajuguri-web | grep -q 'Up' \
              && echo '✅ Web deployed' \
              || (echo '❌ Web failed to start' && exit 1)
