name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:  # 수동 트리거 (BACKEND_ENV 시크릿 변경 후 사용)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 가정용 서버(동적 IP)라 ssh-keyscan 대신 appleboy/ssh-action으로 접속한다.
      # backend.env는 레포 밖(~/servers/sajuguri)에 BACKEND_ENV 시크릿을 heredoc로 기록.
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PC_SSH_HOST }}
          username: ${{ secrets.PC_SSH_USER }}
          key: ${{ secrets.PC_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            mkdir -p ~/servers/sajuguri
            cat > ~/servers/sajuguri/backend.env << 'BACKENDENV_EOF'
            ${{ secrets.BACKEND_ENV }}
            BACKENDENV_EOF

            cd ~/servers/sajuguri/repo
            git fetch origin
            git reset --hard origin/main

            cd ~/servers
            docker rm -f sajuguri-backend 2>/dev/null || true
            docker compose build --no-cache sajuguri-backend
            docker compose up -d sajuguri-backend

            echo '⏳ Waiting for startup...'
            sleep 8
            docker logs sajuguri-backend --tail=5
            docker inspect -f '{{.State.Running}}' sajuguri-backend | grep -q 'true' \
              && echo '✅ Backend deployed' \
              || (echo '❌ Backend failed to start' && exit 1)

            # 비동기 생성 워커 — backend와 같은 이미지(servers-sajuguri-backend) 재사용.
            docker rm -f sajuguri-worker 2>/dev/null || true
            docker compose up -d sajuguri-worker
            sleep 3
            docker logs sajuguri-worker --tail=5
            docker inspect -f '{{.State.Running}}' sajuguri-worker | grep -q 'true' \
              && echo '✅ Worker deployed' \
              || (echo '❌ Worker failed to start' && exit 1)
